name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # unit, golden (byte-identical 518-case output), API, and Temporal workflow tests
      # (time-skipping test server + local dev server, downloaded by the Temporal SDK)
      - run: pytest -q --cov=erasure_audit --cov-report=term-missing:skip-covered

  eval:
    name: Evaluation regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Score labelled cases (rules classifier, no API key needed)
        run: >
          erasure-audit eval --cv --out eval/results/ci
          --min-verdict-accuracy 1.0 --min-step-f1 0.943
      - name: Publish results to the job summary
        if: always()
        run: test -f eval/results/ci/results.md && sed -n '1,/^## Per case/p' eval/results/ci/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/ci/

  docker:
    name: Image and compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: erasure-audit:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Golden output inside the container
        run: |
          docker run --rm erasure-audit:dev sh -c 'erasure-audit run --output /tmp/o.csv >/dev/null && cat /tmp/o.csv' > out.csv
          cmp out.csv tests/golden/output.csv
      - name: Start Temporal, worker and API
        run: docker compose up -d --no-build --wait --wait-timeout 180 temporal api
      - name: Smoke test (submit, idempotency, approval signal, remediation)
        run: python3 scripts/smoke.py --base-url http://localhost:8000 --timeout 120
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
